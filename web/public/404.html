<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FloBoard</title>
    <script>
      // Netlify serves this for paths it can't resolve. The app uses hash routing,
      // so the requested path is moved into the hash. Old GitHub Pages links
      // (…/floboard/markets) lose their prefix and keep working.
      (function () {
        var path = location.pathname.replace(/^\/floboard/, '');
        if (!path || path === '/' || path === '/index.html') path = '/markets';
        if (path.charAt(0) !== '/') path = '/' + path;
        location.replace('/#' + path + location.search);
      })();
    </script>
  </head>
  <body></body>
</html>
