# Netlify deployment (replaces the former GitHub Pages workflow).
# The web client lives in web/ and is built with Vite into web/dist.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

# The Render API's CORS allow-list only knows the old GitHub Pages origin, so the
# browser calls /api/* on this origin and Netlify proxies it to Render. Mirrors
# web/public/_redirects, so the proxy survives even if that file is ever dropped.
[[redirects]]
  from = "/api/*"
  to = "https://floboard-api.onrender.com/api/:splat"
  status = 200

# Headers Netlify serves from its edge. frame-ancestors cannot be expressed by the
# <meta> CSP in web/index.html (browsers ignore it there), so framing is refused
# with a real header; the referrer policy is restated at the transport layer too.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
